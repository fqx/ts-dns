version: 2
project_name: ts-dns
builds:
  - main: ./cmd
    binary: ts-dns
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.VERSION={{.Version}}
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm, '386', mips, mipsle, mips64, mips64le]
    goarm: ['6', '7']
    gomips: [hardfloat, softfloat]
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - ts-dns*.toml
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:']
